[project]
name = "bridgify-ml"
version = "0.1.0"
description = "Bridgify on-device sign, gesture and emotion models: data prep, training, evaluation, export"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mediapipe>=0.10.14",
    "numpy",
    "pandas",
    "scikit-learn",
    "torch",
    "pyarrow",
    "pillow",
    "pyyaml",
    "pytest",
    "matplotlib",
    "huggingface_hub",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
include = ["bridgify_ml*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
